name: Docs

# The guide and the README figures are generated by running the package against
# live AURN data, so this job depends on DEFRA being reachable. That is fine for
# a scheduled check but a poor reason to block a pull request, so it does not run
# on push. It catches the documentation going stale after a signature change.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install with the documentation extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[calendar,docs]' pyarrow pillow

      - name: Rebuild the guide
        # Exits non-zero if any public function is left undocumented.
        run: python examples/build_guide.py

      - name: Rebuild the README figures
        run: python examples/build_readme_figures.py

      - name: Run the worked example
        # Exits non-zero if any public function goes unexercised.
        run: python examples/demo_leeds.py

      - name: Report anything that changed
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "::warning::Regenerating changed the committed documentation:"
            git status --porcelain docs/
            git diff --stat docs/
          else
            echo "Documentation is up to date."
          fi

  conda:
    # environment.yml is offered as an install route, so it needs exercising or
    # it rots. Weekly is enough; it does not gate pull requests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: PythonAQ
          auto-activate-base: false

      - name: Import the package and report versions
        shell: bash -el {0}
        run: |
          python -c "
          import PythonAQ, sys
          print('python', sys.version.split()[0])
          print('PythonAQ', PythonAQ.__version__)
          names = [n for n in PythonAQ.__all__ if not n.startswith('__')]
          print(len(names), 'public functions importable')
          "
