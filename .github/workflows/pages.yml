name: Pages

# Publishes docs/ to GitHub Pages, which serves the guide at
# <owner>.github.io/PythonAQ/guide/.
#
# Pages must be enabled once by hand: Settings > Pages, source "GitHub Actions".
#
# enablement: true is set below and does not remove that step. Creating a Pages
# site needs admin rights, which GITHUB_TOKEN does not have whatever the
# workflow's permissions block says; pages: write allows deploying to Pages, not
# creating it. Left on because it is harmless and would cover the case where the
# site is later removed, but the first run still fails with "Resource not
# accessible by integration" until the switch is flipped.
#
# Note what enabling it means: everything under docs/ becomes publicly readable
# at a github.io address, whatever the repository's own visibility. That is the
# intent here, since docs/ holds the guide and the README figures and nothing
# else, but it is why this is a deliberate choice rather than a default.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already, instead of failing.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
