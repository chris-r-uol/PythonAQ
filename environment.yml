name: PythonAQ
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy>=1.24
  - pandas>=2.0
  - plotly>=5.15
  - scipy>=1.10
  - requests>=2.28
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - pip
  - pip:
      # Not available, or not current, on conda-forge
      - rdata>=0.11
      - pymannkendall>=1.4
      - pygam>=0.9
      # Install the package itself, which pulls in anything missed above
      - -e .
